name: Terraform - Infra Database

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Sem isso, merges em sequência rápida disparavam applies sobrepostos, cada um
# brigando pelo lock do DynamoDB do mesmo state — um deles sempre falhava com
# "Error acquiring the state lock" (mesmo problema já corrigido no infra-k8s).
# Só roda um apply por vez — os outros esperam na fila em vez de colidir.
concurrency:
  group: terraform-infra-database
  cancel-in-progress: false

# AWS Academy: credenciais de sessão temporárias (expiram com o Lab), não
# suporta OIDC nem IAM role de longa duração — ver README > "AWS Academy".
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_DEFAULT_REGION: us-east-1

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4.2.2

      # AWS Academy reseta a conta entre sessões — o bucket "-augusto" original
      # ficou órfão (de uma sessão/conta anterior, inacessível agora). Sufixo
      # "-augusto-2": idempotente, só cria o que faltar.
      - name: Bootstrap do backend remoto (S3 + DynamoDB)
        run: |
          BUCKET="soat-tech-challenge-tfstate-augusto-2"
          TABLE="soat-tech-challenge-tfstate-lock-augusto-2"

          # || true: outro repo (infra-k8s/lambda) pode estar criando o
          # mesmo bucket/tabela ao mesmo tempo — o create falha com "already
          # exists"/"ResourceInUseException", mas o wait abaixo garante que
          # seguimos só depois do recurso existir de verdade, não importa quem criou.
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region us-east-1 || true
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true || true
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled || true
          fi
          aws s3api wait bucket-exists --bucket "$BUCKET"

          if ! aws dynamodb describe-table --table-name "$TABLE" --region us-east-1 >/dev/null 2>&1; then
            aws dynamodb create-table --table-name "$TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region us-east-1 || true
          fi
          aws dynamodb wait table-exists --table-name "$TABLE" --region us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan

  apply:
    name: Apply
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment: producao
    steps:
      - uses: actions/checkout@v4.2.2

      # AWS Academy reseta a conta entre sessões — o bucket "-augusto" original
      # ficou órfão (de uma sessão/conta anterior, inacessível agora). Sufixo
      # "-augusto-2": idempotente, só cria o que faltar.
      - name: Bootstrap do backend remoto (S3 + DynamoDB)
        run: |
          BUCKET="soat-tech-challenge-tfstate-augusto-2"
          TABLE="soat-tech-challenge-tfstate-lock-augusto-2"

          # || true: outro repo (infra-k8s/lambda) pode estar criando o
          # mesmo bucket/tabela ao mesmo tempo — o create falha com "already
          # exists"/"ResourceInUseException", mas o wait abaixo garante que
          # seguimos só depois do recurso existir de verdade, não importa quem criou.
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region us-east-1 || true
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true || true
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled || true
          fi
          aws s3api wait bucket-exists --bucket "$BUCKET"

          if ! aws dynamodb describe-table --table-name "$TABLE" --region us-east-1 >/dev/null 2>&1; then
            aws dynamodb create-table --table-name "$TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region us-east-1 || true
          fi
          aws dynamodb wait table-exists --table-name "$TABLE" --region us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init
        run: terraform init -input=false

      # O AWS Academy reseta a conta periodicamente (apaga EC2/RDS/etc., que custam
      # dinheiro) mas não limpa o SSM Parameter Store (gratuito) — depois de um reset, o
      # Terraform começa com state vazio e tenta recriar esses 5 parâmetros que já
      # sobreviveram do antes do reset, falhando com "ParameterAlreadyExists" (mesmo
      # problema já visto no infra-k8s). "import" só ensina o Terraform sobre o que já
      # existe, sem alterar valor; "|| true" torna seguro rodar em toda apply.
      - name: Importar parâmetros SSM que já existem (corrige drift de state)
        run: |
          import() { terraform import -input=false "$1" "$2" || true; }

          import aws_ssm_parameter.db_password /soat/producao/rds/password
          import aws_ssm_parameter.db_endpoint /soat/producao/rds/endpoint
          import aws_ssm_parameter.db_port /soat/producao/rds/port
          import aws_ssm_parameter.db_name /soat/producao/rds/db-name
          import aws_ssm_parameter.db_username /soat/producao/rds/username

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false -lock-timeout=5m
